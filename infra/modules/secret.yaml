AWSTemplateFormatVersion: "2010-09-09"
Description: >
  The model keys. CloudFormation owns the containers. It never writes the
  real values, so an update does not wipe them. Deleting the stack deletes
  the containers. The phone path does not fall through when a key is empty.

Parameters:
  Project:
    Type: String
    Default: west2romaji
    AllowedValues:
      - west2romaji

Resources:
  ApiKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${Project}/xai-api-key"
      Description: xAI API key. CloudFormation creates the container and does not write the value.
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: ManagedBy
          Value: cloudformation

  GeminiKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${Project}/gemini-api-key"
      Description: Gemini API key. Used when the direct-call raffle picks Gemini. CloudFormation does not write the value.
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  SecretArn:
    Description: ARN of the xAI key. The value is not an output.
    Value: !Ref ApiKey
  SecretName:
    Description: Name passed to put-secret-value.
    Value: !Sub "${Project}/xai-api-key"
  GeminiSecretArn:
    Description: ARN of the Gemini key. The value is not an output.
    Value: !Ref GeminiKey
  GeminiSecretName:
    Description: Name passed to put-secret-value for Gemini.
    Value: !Sub "${Project}/gemini-api-key"
